:root{--ink:#19342e;--muted:#63726b;--line:#d9e2da;--paper:#f4f6f0;--green:#206b51;--soft:#e9f3ec;--orange:#a55722}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.65}header{border-bottom:1px solid var(--line);background:#fff;padding:18px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;gap:16px}header b{letter-spacing:-.6px}main{max-width:1120px;margin:auto;padding:38px 24px 80px}h1{font-size:36px;line-height:1.3;letter-spacing:-1.3px;margin:10px 0 20px}h2{font-size:23px;margin:0 0 12px}h3{font-size:18px;margin:0 0 10px}p{margin:10px 0 18px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--green)}.muted,small{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin:20px 0}.accent{background:var(--soft);border-left:5px solid var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pill{display:inline-block;background:var(--soft);border-radius:30px;padding:4px 12px;font-size:13px}.flow{display:flex;flex-wrap:wrap;gap:10px}.flow span{padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:white}button,.button{font:inherit;cursor:pointer;border-radius:10px;padding:12px 20px;border:1px solid var(--green);background:var(--green);color:white;font-weight:650}button.secondary{background:white;color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d68b32;outline-offset:3px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}input[type=text],input[type=number],select,textarea{font:inherit;border:1px solid #aebeb1;border-radius:9px;padding:10px;width:100%;background:white;color:var(--ink)}textarea{min-height:95px;resize:vertical}.field{display:block;margin:14px 0}.field>span{display:block;font-weight:650;margin-bottom:6px}label.choice{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:9px 0;cursor:pointer}label.choice:has(input:checked){background:var(--soft);border-color:var(--green)}input[type=radio],input[type=checkbox]{accent-color:var(--green);width:18px;height:18px;vertical-align:middle;margin-right:8px}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;background:#fff;min-width:610px}th,td{padding:14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}thead th{background:#edf1eb}tbody th{width:24%;font-weight:550}tr:last-child>*{border-bottom:0}.scale{display:flex;gap:8px;flex-wrap:wrap}.scale label{flex:1;min-width:44px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:10px 5px;cursor:pointer}.scale input{display:block;margin:0 auto 4px}.scale label:has(input:checked){background:var(--soft);border-color:var(--green)}.scaleends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}details{margin-top:15px}summary{cursor:pointer;font-weight:650}.error{color:#a32f23;font-weight:650}.progress{height:5px;background:#e0e8df}.progress div{height:100%;background:var(--green)}.kpi{font-size:28px;font-weight:750}.rubric{font-size:14px;background:#f5f6f0;padding:12px;border-radius:9px}.notice{padding:12px 16px;background:#fff4df;border-radius:10px}.narrow{max-width:800px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){h1{font-size:28px}.grid{grid-template-columns:1fr}main{padding:25px 16px 55px}.panel{padding:18px}header{padding:14px 16px}button{padding:11px 15px}}

'use strict';
const VERSION='2.0.0',KEY='hci_understanding_pilot_v2';
const CASES=[
{id:'credit',title:'졸업 심사에 반영할 학교',goal:'민서는 이번 졸업 심사에 전공필수 3학점을 반영해야 합니다. 서류 마감은 2월 10일, 총예산은 600만 원입니다. 필수 조건을 모두 충족하는 학교 중 총비용이 가장 낮은 학교를 선택하세요.',rules:['전공필수 반영에는 전공 인정 승인과 마감일까지의 성적표 도착이 모두 필요합니다.','학기 종료일과 성적표 도착일은 다릅니다. 아래 비용에는 모든 필수 지출이 포함됩니다.'],rows:[['총비용','470만 원','550만 원','590만 원'],['전공필수 인정','승인 완료','승인 완료','승인 완료'],['학기 종료','1월 20일','1월 30일','1월 25일'],['성적표 도착','2월 20일','2월 5일','2월 8일']],answer:'B',ai:'B학교를 추천합니다. 세 학교 모두 전공필수 인정 승인을 받았지만, 이번 졸업 심사에는 2월 10일까지 성적표가 도착해야 합니다. A는 학기가 먼저 끝나도 서류가 늦게 도착합니다. B와 C는 마감과 예산을 충족하며, 그중 B의 총비용이 낮습니다.',qs:[{type:'explain',q:'A는 B보다 학기가 먼저 끝납니다. 그런데도 이번 졸업 심사에 A가 적합하지 않은 이유를 설명하세요.',rubric:'2점: 학기 종료와 성적표 도착을 구분하고 A의 2월 20일 도착이 2월 10일 마감을 넘는다고 연결. 1점: 성적표가 늦는다는 사실만 언급. 0점: 종료일만으로 판단하거나 무관한 설명.'},{type:'explain',q:'B와 C 모두 마감과 예산을 충족합니다. B를 선택하는 판단 순서를 설명하세요.',rubric:'2점: 전공 승인·성적표 마감·예산 충족을 확인한 뒤 B가 C보다 저렴하다는 우선순위 연결. 1점: B가 더 저렴하다는 사실만 언급. 0점: 무관하거나 잘못된 이유.'},{type:'transfer',q:'다른 조건은 그대로이고 서류 마감만 2월 25일로 늦춰졌습니다. 어느 학교를 선택해야 하며, 왜 그렇습니까?',correct:'A',rubric:'2점: A 선택 + 성적표가 새 마감 안에 도착하며 적격 학교 중 최저비용임을 연결. 1점: A 선택이나 이유 불완전. 0점: 다른 선택 또는 모름.'},{type:'transfer',q:'원래의 2월 10일 마감으로 돌아갑니다. B의 성적표 도착만 2월 12일로 늦어지면 어느 학교를 선택해야 하며, 왜 그렇습니까?',correct:'C',rubric:'2점: C 선택 + A·B는 마감 초과, C는 마감·승인·예산 충족을 연결. 1점: C 선택이나 이유 불완전. 0점: 다른 선택 또는 모름.'}]},
{id:'housing',title:'도착 직후 머물 수 있는 학교',goal:'준호는 8월 20일에 도착하며 그날부터 9월 1일 전날까지 숙소가 필요합니다. 숙소 관련 총예산은 200만 원입니다. 예산 안에서 모든 밤의 숙박이 보장되는 학교 중 총 숙박비가 가장 낮은 곳을 선택하세요.',rules:['기숙사 입주일부터는 숙박이 보장됩니다. 도착일부터 입주 전날까지는 학교가 보장하는 임시숙소가 필요합니다.','총 숙박비 = 기숙사 고정비 + 임시숙소 비용입니다. 임시숙소가 무료가 아니면 1박당 10만 원이며, 학교가 보장하지 않는 별도 숙소는 구할 수 없습니다.'],rows:[['기숙사 입주일','8월 24일','8월 22일','8월 20일'],['기숙사 고정비','130만 원','160만 원','190만 원'],['도착~입주 전날 임시숙소','전 기간 보장 · 유료','전 기간 보장 · 무료','필요 없음'],['기숙사 이용 보장','9월 1일까지','9월 1일까지','9월 1일까지']],answer:'B',ai:'B학교를 추천합니다. A는 8월 20~23일의 4박 임시숙소 비용 40만 원을 더해 총 170만 원입니다. B는 입주 전 2박이 무료로 보장되어 총 160만 원입니다. C는 도착일부터 입주할 수 있지만 총 190만 원입니다. 모두 숙박과 예산 조건을 충족하며 B가 가장 저렴합니다.',qs:[{type:'explain',q:'기숙사 고정비는 A가 가장 낮습니다. 그런데 B의 총 숙박비가 더 낮은 이유를 설명하세요.',rubric:'2점: A 4박×10만 원을 더한 170만 원과 B 무료 임시숙소 포함 160만 원 비교. 1점: A에 추가 숙박비가 있다는 이유만 설명. 0점: 고정비만 비교하거나 잘못된 계산과 결론.'},{type:'explain',q:'C는 도착일부터 입주할 수 있습니다. 그런데도 원래 조건에서 B를 선택하는 이유는 무엇입니까?',rubric:'2점: B도 임시숙소로 모든 밤이 보장되고, 그중 총비용이 C보다 낮음을 연결. 1점: B가 싸다는 사실만 설명. 0점: B의 숙박 공백을 주장하거나 무관한 설명.'},{type:'transfer',q:'다른 조건은 그대로이고 도착일만 8월 24일로 바뀝니다. 고정비는 줄어들지 않습니다. 어느 학교가 적합하며, 왜 그렇습니까?',correct:'A',rubric:'2점: A 선택 + 이제 임시숙소 비용 없이 입주 가능하고 총 130만 원으로 최소임을 설명. 1점: A 선택이나 이유 불완전. 0점: 다른 선택 또는 모름.'},{type:'transfer',q:'원래 도착일 8월 20일로 돌아갑니다. B의 임시숙소만 무료에서 1박당 10만 원의 유료로 바뀝니다. 어느 학교가 적합하며, 왜 그렇습니까?',correct:'A',rubric:'2점: A 선택 + B 180만 원, A 170만 원, C 190만 원 비교. 1점: A 선택이나 이유 불완전. 0점: 다른 선택 또는 모름.'}]},
{id:'grant',title:'장학금을 고려한 학교',goal:'서윤은 출국 전 납부할 수 있는 돈이 최대 650만 원이며, 장학금을 받은 뒤의 최종 본인 부담은 500만 원 이하여야 합니다. 이번에 인정받을 전공 학점은 9학점입니다. 두 금액 조건을 모두 충족하는 학교 중 최종 본인 부담이 가장 낮은 곳을 선택하세요.',rules:['모든 비용은 출국 전에 전액 납부해야 합니다. 장학금은 귀국 후 지급되며 출국 전 납부액에서 미리 뺄 수 없습니다.','최종 본인 부담 = 출국 전 납부액 − 실제 수령하는 장학금입니다. 지급 기준에 미달하면 장학금은 0원입니다.'],rows:[['출국 전 납부액','620만 원','570만 원','490만 원'],['귀국 후 장학금','200만 원','100만 원','없음'],['장학금 지급 기준','전공 인정 12학점 이상','전공 인정 9학점 이상','해당 없음'],['인정 예정 전공 학점','9학점','9학점','9학점']],answer:'B',ai:'B학교를 추천합니다. 현재 9학점 인정으로 A의 12학점 장학금 기준은 충족하지 못하므로 A의 최종 부담은 620만 원입니다. B는 100만 원을 수령해 최종 부담이 470만 원이고, C는 490만 원입니다. B와 C는 출국 전 한도와 최종 부담 한도를 모두 충족하며 B의 최종 부담이 더 낮습니다.',qs:[{type:'explain',q:'A의 장학금이 더 큰데도 원래 조건에서 A를 선택할 수 없는 이유를 설명하세요.',rubric:'2점: 9학점이 12학점 기준에 미달해 장학금 0원, 최종 620만 원이 500만 원 한도를 넘음을 연결. 1점: 학점 미달 또는 최종 예산 초과만 언급. 0점: 200만 원을 수령한다고 계산.'},{type:'explain',q:'C의 출국 전 납부액이 더 낮은데도 B를 선택하는 이유를 설명하세요.',rubric:'2점: B의 선납 570만 원은 650만 원 한도 내이고 장학금 후 470만 원이 C 490만 원보다 낮다고 연결. 1점: 장학금 후 B가 싸다는 사실만 설명. 0점: 선납과 최종 부담을 혼동.'},{type:'transfer',q:'다른 조건은 그대로이고 인정 예정 전공 학점이 모든 학교에서 12학점으로 늘어납니다. 어느 학교를 선택해야 하며, 왜 그렇습니까?',correct:'A',rubric:'2점: A 선택 + 선납 620만 원이 한도 내이고 장학금 200만 원 수령 후 420만 원으로 최소임을 연결. 1점: A 선택이나 이유 불완전. 0점: 다른 선택 또는 모름.'},{type:'transfer',q:'원래 9학점 인정으로 돌아갑니다. 출국 전 납부 가능 금액만 500만 원으로 줄어들면 어느 학교를 선택해야 하며, 왜 그렇습니까?',correct:'C',rubric:'2점: C 선택 + A·B 선납액이 한도 초과이고 귀국 후 장학금을 선납에 쓸 수 없으며 C는 490만 원으로 충족. 1점: C 선택이나 이유 불완전. 0점: 다른 선택 또는 모름.'}]}
];
const ORDERS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
let S=null, reviewer=false;const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){$('storageNote')?.remove();let p=document.createElement('p');p.id='storageNote';p.className='notice';p.textContent='이 환경에서는 자동 저장이 제한됩니다. 완료 후 반드시 결과를 다운로드하세요.';$('app').append(p)}}
function log(event,extra={}){if(S){S.events.push({at:new Date().toISOString(),phase:S.phase,round:S.round,event,...extra});persist()}}
function move(phase){S.phase=phase;S.phaseAt=Date.now();persist();render();window.scrollTo(0,0)}
function elapsed(){return Math.round((Date.now()-S.phaseAt)/100)/10}
function table(c){return `<div class="tablewrap"><table><thead><tr><th scope="col">판단에 필요한 정보</th>${['A','B','C'].map(x=>`<th scope="col">${x}학교</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr><th scope="row">${r[0]}</th>${r.slice(1).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function source(c){return `<section class="panel"><h2>${c.title}</h2><p>${c.goal}</p><div class="rubric">${c.rules.map(x=>`<p>${x}</p>`).join('')}</div><div style="margin-top:18px">${table(c)}</div></section>`}
function choices(name,unknown=true){return ['A','B','C',...(unknown?['unknown']:[])].map(x=>`<label class="choice"><input type="radio" name="${name}" value="${x}" required>${x==='unknown'?'잘 모르겠습니다':x+'학교'}</label>`).join('')}
function scale(name,title){return `<div class="field"><span>${title}</span><div class="scale">${[1,2,3,4,5,6,7].map(n=>`<label><input type="radio" name="${name}" value="${n}" required>${n}</label>`).join('')}</div><div class="scaleends"><span>1 · 전혀 그렇지 않다</span><span>7 · 매우 그렇다</span></div></div>`}
function startPage(){let saved=false;try{saved=!!localStorage.getItem(KEY)}catch(e){}$('app').innerHTML=`<div class="eyebrow">DECISION & UNDERSTANDING / PILOT 02</div><h1>결정을 내린 뒤,<br>어디까지 설명할 수 있을까요?</h1><p class="muted narrow">가상의 교환학생 사례를 읽고 학교를 선택합니다. 각 선택 직후, 원자료를 참고하면서 이유를 설명하고 바뀐 조건에 적용합니다.</p><div class="flow"><span>안내 및 연습</span><span>사례 선택 × 3</span><span>매번 예상 점수 → 설명·적용</span><span>응답 다운로드</span></div><div class="grid"><section class="panel"><h2>시작 설정</h2><form id="setup"><label class="field"><span>참가자 코드</span><input name="pid" type="text" maxlength="40" placeholder="예: P001 (이름 대신 코드)" required></label><label class="field"><span>실행 방식</span><select name="mode"><option value="random">무작위 배정 · 참가자 실행</option><option value="A">A 조건 체험 · 공통 자료만</option><option value="B">B 조건 체험 · 공통 자료 + AI 판단 지원</option></select></label><label class="field"><span>사례 순서</span><select name="order"><option value="random">무작위 순서</option>${ORDERS.map((o,i)=>`<option value="${i}">${i+1}번 순서 · ${o.map(x=>x+1).join(' → ')}</option>`).join('')}</select></label><label class="choice"><input type="checkbox" required>진행 방식과 아래의 데이터 안내를 확인했습니다.</label><button type="submit">안내 및 연습 시작 →</button></form>${saved?'<div class="actions"><button class="secondary" onclick="resume()">이 기기의 이전 응답 이어가기</button></div>':''}</section><section class="panel"><h2>진행 안내</h2><p>연습 1개, 본 사례 3개입니다. 속도 경쟁이 아니며 별도의 제한 시간은 없습니다. 실제 소요 시간은 파일럿에서 확인합니다.</p><p>이유 설명 2문항과 조건 변경 2문항이 매번 이어집니다. 모르면 ‘모르겠음’으로 응답할 수 있습니다.</p><p>평가 중에는 같은 원자료를 다시 볼 수 있습니다. 판단 지원이 제공된 경우 해당 추천과 해석은 평가에서 사라집니다. 외부 AI와 별도 메모는 사용하지 마세요.</p><p>모든 학교와 규칙은 가상입니다. 일부 실행에서는 연구팀이 미리 작성한 고정 AI 지원 예시가 표시됩니다.</p><p class="muted">응답·소요 시간·화면 이탈 및 클릭 로그는 이 브라우저에만 저장됩니다. 서버로 전송하지 않습니다. 파일을 다운로드해 연구자에게 전달하기 전에는 연구자가 응답을 받지 않습니다. 브라우저 저장이 차단된 환경에서는 자동 저장이 안 될 수 있습니다. 이 파일은 예비 실험용이며 정식 연구 동의서를 대체하지 않습니다.</p></section></div><details class="panel"><summary>연구자 안내 · 설계와 사용 범위</summary><p>두 조건의 비교표·정보 위치는 동일합니다. B에만 조건의 연결과 결론을 추가합니다. 참가자 1명은 한 조건을 경험하며, 수동 체험 실행은 본 실험 분석에서 제외하세요. 자동 배정은 독립 무작위이므로 표본 수와 순서의 완전한 균형을 보장하지 않습니다.</p><p>주요 결과: 8점 만점 예상 수행과 사람이 채점한 실제 수행의 차이. 설명 2문항 + 적용 2문항, 각 0~2점입니다. 응답과 채점 기준을 함께 검토하세요. 정답 및 채점 화면은 모두 완료한 뒤에만 나타납니다.</p><p>각 적용 문항은 독립적인 변경이며 이전 변경은 누적하지 않습니다. 연습은 분석에서 제외됩니다. 원자료 재열람이 허용되어 ‘AI 없이 자료를 참고하는 수행’을 측정합니다. 후반 과제에는 연습 및 검사 경험의 영향이 있을 수 있습니다.</p><p>비교표가 항상 보이므로 원자료를 펼쳤다는 로그로 검토 여부를 추정하지 않습니다. 출처 확인 버튼도 인지적 검증의 증거가 아닙니다. 타이머는 벽시계 시간이며 탭 전환·중단 시간도 포함합니다.</p><p>참가자 기기에서는 HTML 소스와 정답을 기술적으로 숨길 수 없습니다. 통제된 파일럿용입니다. 본 실험 전 난이도, 채점 일치도, 예상 점수 질문 이해 여부를 확인하세요.</p><label class="field"><span>기존 JSON 불러오기 · 이 기기의 현재 세션 대체</span><input id="import" type="file" accept=".json,application/json"></label></details>`;$('setup').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(saved&&!confirm('새 실행을 시작하면 이 기기에 저장된 이전 세션이 교체됩니다. 먼저 다운로드했습니까?'))return;const mode=f.get('mode');const n=crypto.getRandomValues(new Uint32Array(2));S={version:VERSION,sessionId:crypto.randomUUID?crypto.randomUUID():String(Date.now()),participant:f.get('pid').trim(),mode,condition:mode==='random'?(n[0]%2?'B':'A'):mode,order:ORDERS[f.get('order')==='random'?n[1]%6:Number(f.get('order'))],startedAt:new Date().toISOString(),phase:'practice',phaseAt:Date.now(),round:0,results:[],events:[],draft:{}};log('session_start');render()};$('import').onchange=loadFile;}
function resume(){try{S=JSON.parse(localStorage.getItem(KEY));if(!validSession(S))throw Error();log('session_resumed');render()}catch(e){alert('호환되는 저장 응답을 찾지 못했습니다.')}}
function validSession(d){return d&&d.version===VERSION&&['A','B'].includes(d.condition)&&['practice','decision','estimate','quiz','done'].includes(d.phase)&&Array.isArray(d.order)&&d.order.length===3&&new Set(d.order).size===3&&d.order.every(n=>Number.isInteger(n)&&n>=0&&n<3)&&Array.isArray(d.results)&&Array.isArray(d.events)&&Number.isInteger(d.round)&&d.round>=0&&d.round<3&&d.draft&&typeof d.draft==='object'}
async function loadFile(e){try{const d=JSON.parse(await e.target.files[0].text());if(!validSession(d))throw Error();if(!confirm('현재 저장 세션을 이 JSON으로 교체할까요?'))return;S=d;persist();render()}catch(err){alert('이 버전에서 내보낸 정상 JSON 파일을 선택하세요.')}}
function render(){if(!S)return startPage();$('status').textContent=S.phase==='done'?'응답 완료':`사례 ${S.round+1} / 3`; $('bar').style.width=(S.phase==='done'?100:(S.round*3+({practice:0,decision:0,estimate:1,quiz:2}[S.phase]||0))/9*100)+'%';if(S.phase==='practice'){ $('app').innerHTML=`<div class="eyebrow">PRACTICE / 연습</div><h1>두 조건을 연결해 보세요.</h1><section class="panel narrow"><p>서류 마감이 3월 10일입니다. X학교의 학기는 3월 1일에 끝나지만 성적표는 3월 15일 도착합니다. 학점 반영에는 마감 전 성적표 도착이 필요합니다.</p><form id="practice"><p><b>X학교의 성적표를 이번 심사에 반영할 수 있습니까?</b></p><label class="choice"><input type="radio" name="p" value="yes" required>가능하다</label><label class="choice"><input type="radio" name="p" value="no" required>불가능하다</label><button>연습 확인</button></form><div id="practiceResult" aria-live="polite"></div></section>`;$('practice').onsubmit=e=>{e.preventDefault();log('practice_answer',{answer:new FormData(e.target).get('p')});$('practiceResult').innerHTML='<p class="notice">불가능합니다. 학기 종료일이 아니라 성적표 도착일이 마감 안에 들어오는지 확인해야 합니다.</p><p>본 과제에서는 매번 4문항, 총 8점입니다. 핵심 이유와 조건의 연결이 모두 정확하면 문항당 2점, 일부만 정확하면 1점, 틀리거나 모르겠으면 0점입니다. 정답은 모든 과제가 끝난 뒤 확인합니다.</p><button onclick="move(\'decision\')">본 과제 시작 →</button>';};return}if(S.phase==='done')return finish();const c=CASES[S.order[S.round]];const head=`<div class="eyebrow">CASE ${S.round+1} / 3</div>`;if(S.phase==='decision'){ $('app').innerHTML=head+`<h1>조건에 맞는 학교를 선택하세요.</h1>`+source(c)+(S.condition==='B'?`<section class="panel accent"><span class="pill">AI 판단 지원</span><h2 style="margin-top:12px">추천: ${c.answer}학교</h2><p>${c.ai}</p><button type="button" class="secondary" id="check">비교표 다시 보기 ↑</button></section>`:'')+`<form id="decision" class="panel narrow"><h2>최종 선택</h2>${choices('choice')}<button type="submit">선택 확정 →</button></form>`;if($('check'))$('check').onclick=()=>{log('source_reference_click');document.querySelector('.tablewrap').scrollIntoView({behavior:'smooth',block:'center'})};$('decision').onsubmit=e=>{e.preventDefault();S.results[S.round]={caseId:c.id,position:S.round+1,choice:new FormData(e.target).get('choice'),decisionSeconds:elapsed(),answers:[],scores:[null,null,null,null]};S.draft={};log('decision_submitted');move('estimate')};return}
if(S.phase==='estimate'){ $('app').innerHTML=head+`<h1>지금의 판단을 돌아보세요.</h1><form id="estimate" class="panel narrow">${scale('burden','학교를 결정하는 데 정신적인 노력이 많이 필요했다.')}<label class="field"><span>다음 평가에서 총 8점 중 몇 점을 받을 것으로 예상하나요?</span><p class="muted">AI 해석 없이 원자료만 보고 이유 설명 2문항과 조건 변경 2문항에 답합니다. 각 문항은 0~2점이며 총 8점입니다.</p><select name="prediction" required><option value="">예상 점수 선택</option>${Array.from({length:9},(_,n)=>`<option value="${n}">${n}점 / 8점</option>`).join('')}</select></label><button>예상 점수 제출 · 평가 시작 →</button></form>`;$('estimate').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(S.results[S.round],{burden:Number(f.get('burden')),prediction:Number(f.get('prediction')),estimateSeconds:elapsed()});log('estimate_submitted');move('quiz')};return}
if(S.phase==='quiz'){ $('app').innerHTML=head+`<h1>원자료를 보고 설명·적용하세요.</h1><p class="muted">추천과 해석은 제공되지 않습니다. 아래 원자료는 자유롭게 다시 볼 수 있습니다. 각 조건 변경은 서로 독립적입니다.</p>`+source(c)+`<form id="quiz">${c.qs.map((q,i)=>`<section class="panel"><span class="pill">${i<2?'이유 설명':'조건 변경'} · ${i+1} / 4 · 2점</span><h3 style="margin-top:12px">${q.q}</h3>${q.type==='transfer'?choices('pick'+i):''}<label class="field"><span>${q.type==='transfer'?'선택한 이유':'핵심 이유'} · 항목식으로 짧게 써도 됩니다.</span><textarea name="text${i}" maxlength="2000" required placeholder="잘 모르겠다면 ‘모르겠음’이라고 적어주세요."></textarea></label></section>`).join('')}<button>이번 사례 응답 제출 →</button></form>`;const form=$('quiz');for(const [k,v] of Object.entries(S.draft)){const el=form.elements.namedItem(k);if(el)el.value=v}form.oninput=()=>{S.draft=Object.fromEntries(new FormData(form));persist()};form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);for(let i=0;i<4;i++){if(!String(f.get('text'+i)||'').trim()){alert('이유를 입력하거나 모르겠음이라고 적어주세요.');return}}const r=S.results[S.round];r.answers=c.qs.map((q,i)=>({type:q.type,text:String(f.get('text'+i)).trim(),pick:q.type==='transfer'?f.get('pick'+i):null}));r.quizSeconds=elapsed();S.draft={};log('quiz_submitted');if(S.round<2){S.round++;move('decision')}else{S.finishedAt=new Date().toISOString();move('done')}}}}
function scoreTotal(r){return r.scores.length===4&&r.scores.every(v=>Number.isInteger(v)&&v>=0&&v<=2)?r.scores.reduce((a,b)=>a+b,0):null}
function finish(){const manual=S.mode!=='random';$('app').innerHTML=`<div class="eyebrow">SESSION COMPLETE</div><h1>세 사례의 응답을 마쳤습니다.</h1><p>응답 파일을 다운로드해 보관하세요. 서술형 답변을 채점하기 전에는 실제 수행 점수와 이해 격차를 계산하지 않습니다.</p>${manual?'<p class="notice">이 실행은 수동 조건 체험입니다. 본 실험 참가자 데이터와 구분하세요.</p>':''}<section class="panel"><div class="grid"><div><small>참가자 코드</small><div class="kpi">${esc(S.participant)}</div></div><div><small>수행한 사례</small><div class="kpi">${S.results.length}개</div></div></div><div class="actions"><button onclick="download('json')">전체 응답 JSON 다운로드</button><button class="secondary" onclick="download('csv')">분석용 CSV 다운로드</button><button class="secondary" onclick="if(confirm('응답을 다운로드했나요? 시작 화면으로 이동합니다.')){S=null;reviewer=false;startPage()}">시작 화면</button></div><p class="muted">JSON: 원응답·로그·채점값. CSV: 사례별 분석 행. 미채점 점수는 빈칸입니다. 자동 전송은 없습니다.</p></section><details class="panel" id="review"><summary>연구자용 · 응답 확인 및 수동 채점</summary><p class="notice">이 화면은 파일럿 검토용이며 비밀번호로 보호되지 않습니다. 정식 채점은 조건을 숨긴 응답 사본을 두 명이 독립 채점한 뒤 합의 점수를 기록하는 방식으로 진행하세요. 여기서는 한 세트의 채점값만 저장합니다.</p>${S.results.map((r,j)=>{const c=CASES.find(x=>x.id===r.caseId);return `<section class="panel"><h2>${j+1}. ${c.title}</h2><p>처음 선택: ${esc(r.choice)} · 기준 선택: ${c.answer} · 예상: ${r.prediction}/8 · 결정: ${r.decisionSeconds}초 · 평가: ${r.quizSeconds}초</p>${c.qs.map((q,i)=>`<div class="field"><h3>${i+1}. ${q.q}</h3><p>${r.answers[i].pick?'선택: '+esc(r.answers[i].pick)+'<br>':''}${esc(r.answers[i].text).replace(/\n/g,'<br>')}</p><p class="rubric">${q.rubric}</p><label><span class="sr">사례 ${j+1} 문항 ${i+1} 점수</span><select aria-label="사례 ${j+1} 문항 ${i+1} 점수" onchange="grade(${j},${i},this.value)"><option value="">미채점</option>${[0,1,2].map(n=>`<option value="${n}" ${r.scores[i]===n?'selected':''}>${n}점</option>`).join('')}</select></label></div>`).join('')}<p id="total${j}" class="notice">${totalText(r)}</p></section>`}).join('')}<p>과대평가 점수 = (예상 점수 − 실제 점수) / 8 × 100. 양수는 과대평가, 음수는 과소평가입니다. 집단 간 비교에서는 예상·실제 점수를 따로 함께 보고하세요.</p><div class="actions"><button onclick="download('json')">채점 포함 JSON 다운로드</button><button class="secondary" onclick="download('csv')">채점 포함 CSV 다운로드</button></div></details>`;$('review').ontoggle=()=>{if($('review').open)log('review_opened')};}
function totalText(r){const t=scoreTotal(r);return t===null?'미채점 · 4문항을 모두 채점하면 격차를 계산합니다.':`실제 수행 ${t}/8 · 예상 ${r.prediction}/8 · 과대평가 ${(r.prediction-t)/8*100}점 (100점 환산)`}
function grade(j,i,v){S.results[j].scores[i]=v===''?null:Number(v);persist();$('total'+j).textContent=totalText(S.results[j])}
function download(kind){log('download',{format:kind});let body,mime;if(kind==='json'){body=JSON.stringify(S,null,2);mime='application/json'}else{const cols=['version','session_id','participant','mode','condition','order','case_id','position','choice','choice_correct','prediction_8','actual_8','overestimation_100','burden_7','decision_seconds','quiz_seconds','q1_text','q1_score','q2_text','q2_score','q3_pick','q3_text','q3_score','q4_pick','q4_text','q4_score'];const rows=S.results.map(r=>{const c=CASES.find(c=>c.id===r.caseId),t=scoreTotal(r);return [VERSION,S.sessionId,S.participant,S.mode,S.condition,S.order.map(n=>CASES[n].id).join('>'),r.caseId,r.position,r.choice,r.choice===c.answer?1:0,r.prediction,t,t===null?null:(r.prediction-t)/8*100,r.burden,r.decisionSeconds,r.quizSeconds,r.answers[0]?.text,r.scores[0],r.answers[1]?.text,r.scores[1],r.answers[2]?.pick,r.answers[2]?.text,r.scores[2],r.answers[3]?.pick,r.answers[3]?.text,r.scores[3]]});const cell=v=>{let x=String(v??'');if(/^[=+@\-\t\r]/.test(x)&&typeof v!=='number')x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};body='\uFEFF'+[cols,...rows].map(r=>r.map(cell).join(',')).join('\r\n');mime='text/csv;charset=utf-8'}const a=document.createElement('a'),u=URL.createObjectURL(new Blob([body],{type:mime}));a.href=u;a.download=`hci_${S.participant.replace(/[^a-zA-Z0-9_-]/g,'_')}_${S.sessionId.slice(0,8)}.${kind}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('visibilitychange',()=>log('visibility',{state:document.visibilityState}));window.addEventListener('beforeunload',e=>{if(S&&S.phase!=='done'){persist();e.preventDefault();e.returnValue=''}});startPage();
</script></body></html>
